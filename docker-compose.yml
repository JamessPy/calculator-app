services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
    healthcheck:
      # The distroless image has no shell and no curl, so the healthcheck
      # would need a purpose-built binary. Left out deliberately.
      disable: true

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - api